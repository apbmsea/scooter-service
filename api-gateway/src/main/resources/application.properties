spring.application.name=api-gateway

# Gateway слушает на 8081, чтобы не конфликтовать с user-service (8080)
server.port=8081

# Включаем HTTPS для API Gateway
server.ssl.enabled=true
server.ssl.key-store=/Users/germancerkasov/Downloads/user-service-main/src/main/resources/keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat

# URLs микросервисов
gateway.services.user-service.url=https://localhost:8080
gateway.services.scooter-service.url=http://localhost:8082
gateway.services.rental-service.url=http://localhost:8083
gateway.services.payment-service.url=http://localhost:8084

# JWT Configuration
jwt.secret=cLyJ/4mlZg2MKUqC4LYR/cjhTZEu20e+jVzMfEyiP/+v089dMbP4jGKVEH8t7rY1sAlcDaCdDhN+w9gYljmPfT

# Caching with Redis
spring.cache.type=redis
spring.cache.redis.time-to-live=30000
spring.cache.redis.cache-null-values=false

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10

# Resilience4j Retry
resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=1s
resilience4j.retry.configs.default.enableExponentialBackoff=true
resilience4j.retry.configs.default.exponentialBackoffMultiplier=2

# Timeout Configuration для Gateway
spring.cloud.gateway.httpclient.connect-timeout=2000
spring.cloud.gateway.httpclient.response-timeout=5000

# Actuator
management.endpoints.web.exposure.include=health,metrics,gateway,tracing
management.endpoint.health.show-details=always

# Logging
logging.level.com.escooter.apigateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG

# Отключаем проверку совместимости версий Spring Boot/Spring Cloud
spring.cloud.compatibility-verifier.enabled=false

# Rate Limiting Configuration
# Лимиты для аутентификации (более строгие - защита от брутфорса)
rate.limit.auth.capacity=10
rate.limit.auth.refill=10
rate.limit.auth.period=60

# Лимиты для обычных пользователей
rate.limit.user.capacity=100
rate.limit.user.refill=100
rate.limit.user.period=60

# Лимиты для администраторов (более высокие)
rate.limit.admin.capacity=200
rate.limit.admin.refill=200
rate.limit.admin.period=60

# Лимиты для поиска самокатов
rate.limit.scooter.capacity=50
rate.limit.scooter.refill=50
rate.limit.scooter.period=60

# Distributed Tracing (Zipkin)
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=10

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true