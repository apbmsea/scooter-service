version: '3.9'
name: "geo-service"

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: postgres_geo_service
    restart: unless-stopped
    environment:
      PGUSER: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: superSecPassword
      POSTGRES_DB: GEO_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5454:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.7
      -c wal_buffers=8MB
      -c random_page_cost=2
      -c effective_io_concurrency=1
      -c work_mem=8192kB
    networks:
      - local

  redis:
    image: redis:7-alpine
    container_name: redis_geo_service
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --save 30 1        
      --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - local

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local

networks:
  local:
    driver: bridge
